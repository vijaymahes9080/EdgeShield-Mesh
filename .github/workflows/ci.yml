name: EdgeShield Mesh CI & Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit flake8 pytest pytest-asyncio pytest-cov

      - name: Run Bandit Security Scanner
        run: |
          bandit -r packages/ services/ apps/api/ -ll -ii || true

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --cov=packages --cov=services --cov=apps/api

      - name: Run 30-Scenario Evaluation Benchmark
        run: |
          python tests/evaluation/benchmark_runner.py

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm install

      - name: Build and Type Check Web Dashboard
        working-directory: apps/web
        run: npm run build
