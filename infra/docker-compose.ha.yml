version: '3.8'

services:
  # Clustered MQTT Broker
  mosquitto-primary:
    image: eclipse-mosquitto:2.0
    container_name: edgeshield-mosquitto-primary
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: always

  # EdgeShield Control Plane (HA Replicas)
  edgeshield-api-1:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: edgeshield-api-primary
    ports:
      - "8000:8000"
    environment:
      - EDGESHIELD_ENV=production
      - EDGESHIELD_PQC_STRICT=true
      - EDGESHIELD_SWARM_LEADER=true
    depends_on:
      - mosquitto-primary
    restart: always

  edgeshield-api-2:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: edgeshield-api-secondary
    ports:
      - "8001:8000"
    environment:
      - EDGESHIELD_ENV=production
      - EDGESHIELD_PQC_STRICT=true
      - EDGESHIELD_SWARM_LEADER=false
    depends_on:
      - mosquitto-primary
    restart: always

  # Distributed Vector Database
  qdrant-cluster:
    image: qdrant/qdrant:v1.7.4
    container_name: edgeshield-qdrant-ha
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

volumes:
  qdrant_data:
