apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: edgeshieldclusters.security.edgeshield.io
spec:
  group: security.edgeshield.io
  names:
    kind: EdgeShieldCluster
    listKind: EdgeShieldClusterList
    plural: edgeshieldclusters
    singular: edgeshieldcluster
    shortNames:
      - esmesh
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                edgeNodesCount:
                  type: integer
                  minimum: 1
                enablePQC:
                  type: boolean
                enableSwarmConsensus:
                  type: boolean
                satelliteUplinkBandwidthLimitKbps:
                  type: integer
                hitlApprovalStrictness:
                  type: string
                  enum: [STRICT, RELAXED, SIMULATION_ONLY]
---
apiVersion: security.edgeshield.io/v1alpha1
kind: EdgeShieldCluster
metadata:
  name: rural-microgrid-cluster-01
  namespace: edgeshield-system
spec:
  edgeNodesCount: 5
  enablePQC: true
  enableSwarmConsensus: true
  satelliteUplinkBandwidthLimitKbps: 64
  hitlApprovalStrictness: STRICT
